name: Build PR 338 (unsigned)

# Personal build of TermiT/Flycut#338 for local install. Produces an unsigned
# Flycut.app as a workflow artifact; it is signed on the installing Mac.

on:
  push:
    branches:
      - pr-338-build

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build and archive (unsigned)
      run: |
        xcodebuild -project Flycut.xcodeproj -scheme Flycut -configuration Release \
          -archivePath build/Flycut.xcarchive archive \
          CODE_SIGNING_ALLOWED=NO

    - name: Zip app
      run: |
        ditto -c -k --keepParent build/Flycut.xcarchive/Products/Applications/Flycut.app build/Flycut.zip
        ls -lh build/Flycut.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flycut-pr338
        path: build/Flycut.zip
        retention-days: 7
